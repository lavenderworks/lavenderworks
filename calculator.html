<!DOCTYPE html>
<html lang="de">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    LavenderWorks Projekt Gestalter
  </title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

  <main class="calculator-page">

    <section class="calculator-section">

      <div class="calculator-wrapper">

        <div class="section-header">

          <span class="section-tag">
            LavenderWorks
          </span>

          <h1>
            Projekt konfigurieren
          </h1>

        </div>

        <!-- PRESET -->

        <div class="form-group">

          <label for="preset">
            Was brauchst du?
          </label>

          <select id="preset"></select>

        </div>
<br><br>
        <!-- FORM -->

        <form id="projectForm">

          <!-- WEBSITE -->

          <div
            class="calculator-group"
            id="websiteSection"
          >
<br><br>
            <h2>Website</h2>

            <div class="form-group">

              <label>
                Website-Typ
              </label>

              <select id="websiteType"></select>

            </div>

            <div class="form-group">
<br><br>
              <label>
                Zusätzliche Seiten
              </label>

              <input
                type="number"
                id="extraPages"
                min="0"
                value="0"
              >

            </div>

            <div
              class="checkbox-group"
              id="domainOptions"
            ></div>

          </div>

          <!-- TEXTS -->

          <div
            class="calculator-group"
            id="textsSection"
          >
<br><br>
            <h2>
              Website Texte
            </h2>

            <div
              class="checkbox-group"
              id="textOptions"
            ></div>

            <div class="form-group">

              <label>
                Anzahl Texte
              </label>

              <input
                type="number"
                id="textCount"
                min="0"
                value="0"
              >

            </div>

          </div>

          <!-- WRITING -->

          <div
            class="calculator-group"
            id="writingSection"
          >
<br><br>
            <h2>
              Kreative Texte
            </h2>

            <select id="writingType"></select>

          </div>

          <!-- TECHSUPPORT -->

          <div
            class="calculator-group"
            id="techsupportSection"
          >
<br><br>
            <h2>
              Techsupport
            </h2>

            <div class="form-group">

              <label>
                Stunden
              </label>

              <input
                type="number"
                id="supportHours"
                value="0"
                min="0"
              >

            </div>
          </div>

          <!-- EXTRAS -->

          <div
            class="calculator-group"
            id="extrasSection"
          >
<br><br>
            <h2>
              Extras
            </h2>

            <div
              class="checkbox-group"
              id="extrasOptions"
            ></div>

          </div>
<!-- INDIVIDUELLE PROJEKTBESCHREIBUNG -->

<div
  class="calculator-group"
  id="customDescriptionSection"
>
<br><br>
  <h2>
    Projektbeschreibung
  </h2>

  <div class="form-group">

    <label for="projectDescription">
      Beschreibe dein Projekt
    </label><br>

    <textarea
      id="projectDescription"
      rows="6"
      placeholder="Beschreibe möglichst genau was du brauchst..."
    ></textarea>

  </div>

</div>
        </form>

        <!-- RESULT -->

        <div class="calculator-result">

          <h2>
            Geschätzter Preis
          </h2>

          <div
            class="price-output"
            id="priceOutput"
          >
            0€
          </div>

          <ul id="summaryList"></ul>

          <a
            id="whatsappButton"
            class="cta-button"
            target="_blank"
          >
            Projekt anfragen
          </a>

        </div>

      </div>

    </section>

  </main>

<script>

let pricingData;

// LOAD JSON
async function loadPricing() {

  const response =
    await fetch("data/pricing.json");

  pricingData =
    await response.json();

  buildForm();

  updatePreset();

  calculatePrice();
}

// BUILD FORM
function buildForm() {

  buildPresets();

  buildWebsiteTypes();

  buildDomains();

  buildTexts();

  buildWriting();

  buildExtras();
}

// PRESETS
function buildPresets() {

  const preset =
    document.getElementById("preset");

  Object.entries(
    pricingData.presets
  ).forEach(([key, value]) => {

    preset.innerHTML += `
      <option value="${key}">
        ${value.label}
      </option>
    `;
  });
}

// WEBSITE TYPES
function buildWebsiteTypes() {

  const select =
    document.getElementById("websiteType");

  pricingData.website.types
    .forEach(type => {

      select.innerHTML += `
        <option value="${type.price}">
          ${type.label} — ${type.price}€
        </option>
      `;
    });
}

// DOMAINS
function buildDomains() {

  const container =
    document.getElementById("domainOptions");

  pricingData.website.domain
    .forEach((domain, index) => {

      container.innerHTML += `
        <br><label>

          <input
            type="radio"
            name="domain"
            value="${domain.price}"
            ${index === 0 ? "checked" : ""}
          >

          ${domain.label}
          ${domain.price > 0
            ? `( +${domain.price}€ )`
            : ""}

        </label>
      `;
    });
}

// TEXTS
function buildTexts() {

  const container =
    document.getElementById("textOptions");

  pricingData.texts.options
    .forEach((option, index) => {

      container.innerHTML += `
        <br><label>

          <input
            type="radio"
            name="texts"
            value="${option.id}"
            ${index === 0 ? "checked" : ""}
          >

          ${option.label}

        </label>
      `;
    });
}

// WRITING
function buildWriting() {

  const select =
    document.getElementById("writingType");

  pricingData.writing
    .forEach(item => {

      select.innerHTML += `
        <option value="${item.price}">
          ${item.label} — ${item.price}€
        </option>
      `;
    });
}

// EXTRAS
function buildExtras() {

  const container =
    document.getElementById("extrasOptions");

  pricingData.extras
    .forEach(extra => {

      container.innerHTML += `
        <br><label>

          <input
            type="checkbox"
            class="extra"
            value="${extra.price}"
            data-name="${extra.label}"
          >

          ${extra.label}
          (+${extra.price}€)

        </label>
      `;
    });
}

// UPDATE PRESET
function updatePreset() {

  const preset =
    document.getElementById("preset").value;

  const sections =
    pricingData.presets[preset].sections;

  document
    .querySelectorAll(".calculator-group")
    .forEach(section => {

      section.style.display = "none";
    });
  sections.forEach(section => {

    const element =
      document.getElementById(
        section + "Section"
      );

    if(element) {

      element.style.display = "block";
    }
  });

  calculatePrice();
}

// CALCULATE
function calculatePrice() {

  let total = 0;

  let summary = [];

  // WEBSITE
  if(
    websiteSection.style.display !== "none"
  ) {

    const website =
      document.getElementById(
        "websiteType"
      );

    total +=
      parseFloat(website.value);

    summary.push(
      website.options[
        website.selectedIndex
      ].text
    );

    const extraPages =
      parseInt(
        document.getElementById(
          "extraPages"
        ).value
      ) || 0;

    if(extraPages > 0) {

      const pagePrice =
        extraPages *
        pricingData.website.extraPage;

      total += pagePrice;

      summary.push(
        `${extraPages} zusätzliche Seiten`
      );
    }

    const domain =
      document.querySelector(
        'input[name="domain"]:checked'
      );

    total +=
      parseFloat(domain.value);
  }

  // TEXTS
  if(
    textsSection.style.display !== "none"
  ) {

    const selected =
      document.querySelector(
        'input[name="texts"]:checked'
      ).value;

    const option =
      pricingData.texts.options.find(
        item => item.id === selected
      );

    const textCount =
      parseInt(
        document.getElementById(
          "textCount"
        ).value
      ) || 0;

    const price =
      option.base +
      (option.perText * textCount);

    total += price;

    if(price > 0) {

      summary.push(
        `${option.label} (${textCount})`
      );
    }
  }

  // WRITING
  if(
    writingSection.style.display !== "none"
  ) {

    const writing =
      document.getElementById(
        "writingType"
      );

    total +=
      parseFloat(writing.value);

    summary.push(
      writing.options[
        writing.selectedIndex
      ].text
    );
  }

  // TECHSUPPORT
  if(
    techsupportSection.style.display
      !== "none"
  ) {

    const hours =
      parseInt(
        document.getElementById(
          "supportHours"
        ).value
      ) || 1;

    const supportPrice =
      hours *
      pricingData.techsupport.hourlyPrice;

    total += supportPrice;

    summary.push(
      `Techsupport (${hours}h)`
    );
    }

  // EXTRAS
  if(
    extrasSection.style.display !== "none"
  ) {

    document
      .querySelectorAll(".extra")
      .forEach(extra => {

        if(extra.checked) {

          total +=
            parseFloat(extra.value);

          summary.push(
            extra.dataset.name
          );
        }
      });
  }

  // OUTPUT
  document.getElementById(
    "priceOutput"
  ).textContent =
    total.toFixed(2) + "€";

  const summaryList =
    document.getElementById(
      "summaryList"
    );

  summaryList.innerHTML = "";

  summary.forEach(item => {

    summaryList.innerHTML += `
      <li>${item}</li>
    `;
  });
const customDescriptionSection =
  document.getElementById(
    "customDescriptionSection"
  );
const projectDescription =
  document.getElementById(
    "projectDescription"
  ).value;
  // WHATSAPP
  const message =
`Hallo LavenderWorks!

Ich interessiere mich für folgendes Projekt:

${summary.join("\n")}

Projektbeschreibung:
${projectDescription}

Geschätzter Preis:
${total.toFixed(2)}€
`;

  document.getElementById(
    "whatsappButton"
  ).href =
    "https://wa.me/4915215448631?text=" +
    encodeURIComponent(message);
}

// EVENTS
document.addEventListener(
  "input",
  calculatePrice
);

document.getElementById(
  "preset"
).addEventListener(
  "change",
  updatePreset
);

// START
loadPricing();

</script>

</body>
</html>
