<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrivatChat</title>

<style>

* {
    box-sizing:border-box;
}

body {
    margin:0;
    height:100vh;
    font-family:Arial, sans-serif;
    background:#ece5dd;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app {
    width:100%;
    max-width:500px;
    height:100vh;
    max-height:800px;
    background:white;
    display:flex;
    flex-direction:column;
}


/* Login */

.login {
    padding:30px;
    margin:auto;
    width:90%;
    text-align:center;
}


input, button, textarea {
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}


button {
    background:#6c4ab6;
    color:white;
    border:none;
    cursor:pointer;
}


button:hover {
    opacity:.85;
}


.hidden {
    display:none;
}


/* Chat */

.header {

    background:#6c4ab6;
    color:white;
    padding:15px;
    text-align:center;

}


.messages {

    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;

}


.message {

    max-width:80%;
    padding:10px;
    margin:5px;
    border-radius:12px;
    word-wrap:break-word;

}


.mine {

    background:#d9fdd3;
    align-self:flex-end;

}


.other {

    background:white;
    align-self:flex-start;

}


.info {

    font-size:11px;
    opacity:.6;
}


.input-area {

    display:flex;
    padding:10px;
    background:#eee;

}


.input-area textarea {

    flex:1;
    resize:none;
    margin:0;

}


.input-area button {

    width:80px;
    margin-left:8px;

}


.error {

    color:red;

}

</style>

</head>


<body>


<div class="app">


<div id="loginBox" class="login">


<h1>PrivatChat</h1>

<p>Raum: <b>PrivatChat</b></p>


<input
id="username"
placeholder="Dein Name">


<input
id="roomPassword"
type="password"
placeholder="Chat-Passwort">


<button onclick="joinChat()">
Chat betreten
</button>


<p id="error" class="error"></p>


</div>




<div id="chatBox" class="hidden">


<div class="header">

<b>PrivatChat</b>
<br>
<span id="currentUser"></span>

</div>


<div id="messages"
class="messages">
</div>


<div class="input-area">

<textarea
id="messageInput"
rows="1"
placeholder="Nachricht..."></textarea>


<button onclick="sendMessage()">
➤
</button>


</div>


</div>



</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// ==========================
// Firebase Konfiguration
// ==========================

const firebaseConfig = {

apiKey: "AIzaSyD5Eec-EpfDGubP4UJ0yCVOLuREWzjLxLA",

authDomain:
"privaterchatleonie.firebaseapp.com",

databaseURL:
"https://privaterchatleonie-default-rtdb.europe-west1.firebasedatabase.app",

projectId:
"privaterchatleonie",

storageBucket:
"privaterchatleonie.firebasestorage.app",

messagingSenderId:
"649802569393",

appId:
"1:649802569393:web:12cf37862a9acb0f95f490"

};



const app =
initializeApp(firebaseConfig);


const db =
getDatabase(app);


// ==========================
// Chat Einstellungen
// ==========================


const ROOM_ID =
"PChat001";


// wird später aus Eingabe erzeugt
let cryptoKey = null;


let username = "";



// ==========================
// Hilfsfunktionen
// ==========================


function bytesToBase64(bytes){

    return btoa(
        String.fromCharCode(...bytes)
    );

}



function base64ToBytes(str){

    return Uint8Array.from(
        atob(str),
        c=>c.charCodeAt(0)
    );

}




// ==========================
// AES Schlüssel erzeugen
// ==========================


async function createKey(password){

    const encoder =
    new TextEncoder();


    const material =
    await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
    );



    // fester Salt für diesen Chatraum
    const salt =
    encoder.encode("PrivatChat-PChat001");



    return await crypto.subtle.deriveKey(

    {
        name:"PBKDF2",
        salt:salt,
        iterations:200000,
        hash:"SHA-256"
    },

    material,

    {
        name:"AES-GCM",
        length:256
    },

    false,

    [
        "encrypt",
        "decrypt"
    ]

    );

}



// ==========================
// Nachricht verschlüsseln
// ==========================


async function encryptText(text){

    const iv =
    crypto.getRandomValues(
        new Uint8Array(12)
    );


    const encrypted =
    await crypto.subtle.encrypt(

    {
        name:"AES-GCM",
        iv:iv
    },

    cryptoKey,

    new TextEncoder()
    .encode(text)

    );



    return {

        iv:
        bytesToBase64(iv),

        data:
        bytesToBase64(
            new Uint8Array(encrypted)
        )

    };

}



// ==========================
// Nachricht entschlüsseln
// ==========================


async function decryptText(obj){

    const decrypted =
    await crypto.subtle.decrypt(

    {

        name:"AES-GCM",

        iv:
        base64ToBytes(obj.iv)

    },

    cryptoKey,

    base64ToBytes(obj.data)

    );


    return new TextDecoder()
    .decode(decrypted);

}
  
// ==========================
// Chat betreten
// ==========================


window.joinChat = async function(){


    const nameInput =
    document.getElementById("username").value.trim();


    const password =
    document.getElementById("roomPassword").value;



    if(!nameInput || !password){

        document.getElementById("error")
        .innerText =
        "Bitte Name und Passwort eingeben";

        return;

    }



    try {


        cryptoKey =
        await createKey(password);



        username =
        nameInput;



        document.getElementById("currentUser")
        .innerText =
        username;



        document.getElementById("loginBox")
        .classList.add("hidden");


        document.getElementById("chatBox")
        .classList.remove("hidden");



        loadMessages();



    } catch(e){


        document.getElementById("error")
        .innerText =
        "Fehler beim Beitreten";


    }


};





// ==========================
// Nachrichten laden
// ==========================


function loadMessages(){


const messagesRef =
ref(
    db,
    "rooms/" +
    ROOM_ID +
    "/messages"
);



onValue(
messagesRef,

async(snapshot)=>{


const box =
document.getElementById("messages");


box.innerHTML="";



for(const child of snapshot.val()
    ? Object.values(snapshot.val())
    : []
){


try{


const text =
await decryptText(child);



const div =
document.createElement("div");



div.className =
"message " +
(
child.sender === username
?
"mine"
:
"other"
);



div.innerHTML = `

<b>${child.sender}</b>

<br>

${text}

<br>

<span class="info">
${new Date(child.time)
.toLocaleString()}
</span>

`;



box.appendChild(div);



}

catch(e){

console.log(
"Nachricht konnte nicht entschlüsselt werden"
);

}


}



box.scrollTop =
box.scrollHeight;



}

);


}

  
// ==========================
// Nachricht senden
// ==========================


window.sendMessage = async function(){


const input =
document.getElementById("messageInput");


const text =
input.value.trim();



if(!text || !cryptoKey){

    return;

}



try{


const encrypted =
await encryptText(text);



await push(

ref(
    db,
    "rooms/" +
    ROOM_ID +
    "/messages"
),

{

sender: username,

iv:
encrypted.iv,

data:
encrypted.data,

time:
Date.now()

}

);



input.value="";


}

catch(e){

console.error(
"Fehler beim Senden:",
e
);

}


};





// ==========================
// Enter = Senden
// ==========================


document
.getElementById("messageInput")
.addEventListener(
"keydown",

function(e){


if(e.key==="Enter" && !e.shiftKey){

    e.preventDefault();

    sendMessage();

}


}

);


</script>


</body>

</html>
